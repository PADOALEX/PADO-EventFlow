services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventflow}
      POSTGRES_USER: ${POSTGRES_USER:-eventflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build:
      context: ./backend/Pado.EventFlow.Api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-eventflow};Username=${POSTGRES_USER:-eventflow};Password=${POSTGRES_PASSWORD}
      AllowedOrigins: http://localhost:5173;http://localhost:8080
      ApplyMigrations: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5080:8080"

  web:
    build:
      context: ./frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:8080:80"

volumes:
  pgdata:
