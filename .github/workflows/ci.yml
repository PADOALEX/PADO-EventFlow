name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eventflow_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: eventflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventflow_test -d eventflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      EVENTFLOW_TEST_CONNECTION: Host=localhost;Port=5432;Database=eventflow_test;Username=eventflow_test;Password=test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore PADO.EventFlow.slnx
      - run: dotnet build PADO.EventFlow.slnx --configuration Release --no-restore
      - run: dotnet test PADO.EventFlow.slnx --configuration Release --no-build

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Start full stack
        run: |
          cp .env.example .env
          docker compose up -d --build
          curl --retry 40 --retry-all-errors --retry-delay 3 --fail http://localhost:8080/health
      - name: Install Playwright
        run: |
          npm install --prefix tests/e2e
          cd tests/e2e && npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: cd tests/e2e && npm test
      - name: Print container logs on failure
        if: failure()
        run: docker compose logs --tail=150
      - name: Shut down containers
        if: always()
        run: docker compose down -v