name: Import EventFlow source
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import complete source package
        shell: bash
        run: |
          if [ ! -f pado_payload.b64 ]; then echo "No import payload"; exit 0; fi
          base64 --decode pado_payload.b64 | tar -xJ --strip-components=1
          npm install --package-lock-only --ignore-scripts --prefix frontend
          rm -f pado_payload.b64 .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: initialize full-stack PADO EventFlow" 
          git push origin HEAD:main
